services:
  mongodb:
    image: mongo:7.0
    container_name: signaldesk_mongo
    restart: unless-stopped
    ports:
    - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: signaldesk
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: signaldesk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:

# Volumes (mongo_data, redis_data): Keep your data persistent across container restarts so your test data isn't wiped when containers stop.
# Healthchecks: Allow other services (and startup scripts) to know when the database engine is actually ready to accept socket connections, not just when the container process starts.